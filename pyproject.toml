[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pta-frequency-sky-leakage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "healpy",
  "lmfit",
  "matplotlib",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
notebook = [
  "ipykernel",
  "nbclient",
  "nbconvert",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
